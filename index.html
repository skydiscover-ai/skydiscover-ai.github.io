<script>
// Mobile nav drawer
(function(){
  var open=document.getElementById('nav-open'),close=document.getElementById('nav-close'),
      drawer=document.getElementById('nav-drawer'),overlay=document.getElementById('nav-overlay');
  function show(){drawer.classList.add('open');overlay.classList.add('open');document.body.style.overflow='hidden';}
  function hide(){drawer.classList.remove('open');overlay.classList.remove('open');document.body.style.overflow='';}
  if(open)open.addEventListener('click',show);
  if(close)close.addEventListener('click',hide);
  if(overlay)overlay.addEventListener('click',hide);
  drawer.querySelectorAll('a').forEach(function(a){a.addEventListener('click',hide);});
})();
(function() {
  var btn = document.getElementById('thm');
  var nav = document.getElementById('nav');
  var saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  function icon() {
    btn.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? '&#9788;' : '&#9790;';
  }
  icon();
  btn.addEventListener('click', function() {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    icon();
  });
  var btn2=document.getElementById('thm2');
  if(btn2){btn2.innerHTML=btn.innerHTML;btn2.addEventListener('click',function(){btn.click();btn2.innerHTML=btn.innerHTML;});}

  // Nav scroll shadow
  window.addEventListener('scroll', function() {
    if (window.scrollY > 10) {
      nav.classList.add('nav--scrolled');
    } else {
      nav.classList.remove('nav--scrolled');
    }
  }, { passive: true });
})();
</script>
